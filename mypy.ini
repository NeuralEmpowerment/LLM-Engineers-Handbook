[mypy]
# Default configuration: forgiving, to avoid errors in existing code
python_version = 3.11
warn_return_any = False
warn_unused_ignores = False
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = False
disallow_untyped_decorators = False
no_implicit_optional = True
strict_optional = True

# Ignore missing imports by default
ignore_missing_imports = True

# Allow inline configuration in files
allow_redefinition = True
local_partial_types = True

# Follow imports normally
follow_imports = normal

# Add type packages that are already installed
# Uncomment if you install numpy
# plugins = numpy.typing.mypy_plugin

# Per-module options
[mypy.plugins.pydantic.*]
follow_imports = skip

# File-specific settings via inline comments at the top of file
# Examples:
# Basic checking: # mypy: disallow-untyped-defs=true
# Medium strictness: # mypy: disallow-untyped-defs=true, disallow-incomplete-defs=true
# High strictness: # mypy: disallow-untyped-defs=true, disallow-incomplete-defs=true, check-untyped-defs=true, disallow-untyped-decorators=true, no-implicit-optional=true, strict-optional=true 